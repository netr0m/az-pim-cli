name: Conventional Commits
on: [workflow_call]

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Check for Conventional Commits compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check commit messages
        uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
        with:
          allowed-commit-types: "feat,fix,refactor,chore,test,ci,build,lint,docs"
